name: Build unsigned IPA

# Self-contained: generates the Xcode project from app.config.ts on the runner,
# so a plain fork of upstream works without committing ios/.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Optional bundle id override (empty = com.dmilin.hydra)"
        required: false
        default: ""
      xcode_version:
        description: "Xcode to use (26.3 required: Swift 6.2 + weak let)"
        required: false
        default: "26.3"
      precompiled:
        description: "Use Expo precompiled modules (16.4 binaries - breaks 16.1)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned release IPA
    runs-on: macos-15
    timeout-minutes: 150
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode
        run: |
          WANT="${{ inputs.xcode_version }}"
          CAND="/Applications/Xcode_${WANT}.app"
          if [ ! -d "$CAND" ]; then
            echo "::error::Xcode $WANT not installed on this image"; exit 1
          fi
          sudo xcode-select -s "$CAND"
          xcodebuild -version

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate iOS project pinned to 16.1
        run: |
          node -e '
            const fs = require("fs");
            let s = fs.readFileSync("app.config.ts", "utf8");
            if (!s.includes("deploymentTarget")) {
              s = s.replace("    ios: {", "    ios: {\n      deploymentTarget: \"16.1\",");
              fs.writeFileSync("app.config.ts", s);
            }
          '
          npx expo prebuild -p ios --no-install

          node -e '
            const fs = require("fs");
            const f = "ios/Podfile.properties.json";
            const j = JSON.parse(fs.readFileSync(f, "utf8"));
            j["EXPO_USE_PRECOMPILED_MODULES"] = "${{ inputs.precompiled }}";
            fs.writeFileSync(f, JSON.stringify(j, null, 2));
          '

          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = "?16\.4"?/IPHONEOS_DEPLOYMENT_TARGET = 16.1/g' \
            ios/Hydra.xcodeproj/project.pbxproj

          if [ -n "${{ inputs.bundle_id }}" ]; then
            perl -pi -e 's/com\.dmilin\.hydra/${{ inputs.bundle_id }}/g' \
              ios/Hydra.xcodeproj/project.pbxproj
            echo "Bundle id rewritten to ${{ inputs.bundle_id }}"
          fi

      # Expo SDK 58 declares a blanket iOS 16.4 floor in every podspec, and
      # expo-modules-autolinking refuses to link any module above the app target.
      # Sources build fine at 16.1; only the JSI xcframework is compiled at 16.4
      # (see the stamping step) because its Swift code genuinely needs that SDK.
      - name: Lower Expo pod floors to 16.1
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const walk = (d, out = []) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) { if (e.name !== ".git") walk(p, out); }
                else if (e.name.endsWith(".podspec")) out.push(p);
              }
              return out;
            };
            const fix = (m, p1) => p1 + "16.1";
            const re1 = /(:ios\s*=>\s*[\x22\x27])16\.4/g;
            const re2 = /(ios:\s*[\x22\x27])16\.4/g;
            let changed = 0, seen = 0;
            for (const f of walk("node_modules")) {
              const s = fs.readFileSync(f, "utf8");
              const n = s.replace(re1, fix).replace(re2, fix);
              seen++;
              if (n !== s) { fs.writeFileSync(f, n); changed++; }
            }
            console.log(`patched ${changed} of ${seen} podspecs`);
          '

      # Swift 6.2 rejects `nonisolated(unsafe) let` captured by a global-actor
      # closure in withEncodedValue. The package ships UncheckedSendable for
      # exactly this (see its doc comment); upstream converted every other site.
      - name: Patch ExpoModulesJSI Swift 6.2 concurrency error
        run: |
          node -e '
            const fs = require("fs");
            const f = "node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift";
            const s = fs.readFileSync(f, "utf8");
            const marker = "private func withEncodedValue(";
            const i = s.indexOf(marker);
            if (i < 0) { console.log("marker not found - upstream may have fixed it"); process.exit(0); }
            const end = s.indexOf("\n}\n", i);
            let fn = s.slice(i, end);
            const before = fn;
            fn = fn
              .replace("nonisolated(unsafe) let slot = buffer.baseAddress!", "let slot = UncheckedSendable(buffer.baseAddress!)")
              .replace("expo.emplaceUndefined(slot)", "expo.emplaceUndefined(slot.value)")
              .replace("expo.destroyValues(slot, 1)", "expo.destroyValues(slot.value, 1)")
              .replace("JavaScriptValue.Slot(slot)", "JavaScriptValue.Slot(slot.value)")
              .replace("body(slot.pointee)", "body(slot.value.pointee)");
            if (fn === before) { console.log("::error::no change applied"); process.exit(1); }
            fs.writeFileSync(f, s.slice(0, i) + fn + s.slice(end));
            console.log("patched withEncodedValue");
          '

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build app (unsigned)
        run: |
          xcodebuild -workspace ios/Hydra.xcworkspace \
            -scheme Hydra -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      # ExpoModulesJSI is compiled at 16.4 with availability checks ENABLED, so it
      # only references symbols that legitimately exist. Only its load metadata is
      # lowered to 16.1, so dyld accepts it on 16.1.
      - name: Stamp ExpoModulesJSI minos to 16.1
        run: |
          FW="build/Build/Products/Release-iphoneos/Hydra.app/Frameworks/ExpoModulesJSI.framework"
          BIN="$FW/ExpoModulesJSI"
          test -f "$BIN" || { echo "::error::ExpoModulesJSI.framework missing"; exit 1; }
          echo "before:"; xcrun vtool -show-build "$BIN" | sed -n '1,8p'
          xcrun vtool -set-build-version ios 16.1 26.2 -replace -output "${BIN}.new" "$BIN"
          mv "${BIN}.new" "$BIN"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 16.1" "$FW/Info.plist"
          echo "after:"; xcrun vtool -show-build "$BIN" | sed -n '1,8p'

      - name: Verify iOS 16.1 floor survived
        run: |
          APP=build/Build/Products/Release-iphoneos/Hydra.app
          echo "app MinimumOSVersion:"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

          BAD=0
          echo "embedded binaries:"
          while IFS= read -r p; do
            v=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$p" 2>/dev/null || echo "")
            [ -z "$v" ] && continue
            echo "  $v  ${p#"$APP"/}"
            if awk -v v="$v" 'BEGIN{exit !(v+0>16.1)}'; then
              BAD=1
              echo "::error file=$p::requires iOS $v"
            fi
          done < <(find "$APP" -name Info.plist)
          if [ "$BAD" -ne 0 ]; then
            echo "::error::At least one embedded binary requires iOS > 16.1"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Hydra.app ipa/Payload/
          cd ipa && zip -qry Hydra-16.1.ipa Payload
          ls -lh Hydra-16.1.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Hydra-16.1-ipa
          path: ipa/Hydra-16.1.ipa
          if-no-files-found: error
          retention-days: 30
